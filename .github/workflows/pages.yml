# Studio website (Astro) on GitHub Pages: https://arcly-studio.github.io/ (org site, repository
# arcly-studio/arcly-studio.github.io). Settings → Pages → Source must be "GitHub Actions"; custom domain empty.
# Only this site is built and checked here – the project sites (/dirwise/, /noirpad/) deploy from their own
# repositories. npm run build = prepare + astro build + guard (no dirwise/noirpad/CNAME at the root) + check-words.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run check:types
      - run: npm test
      - run: npm run build
      - run: npm run check:html
      - run: npm run check:seo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
